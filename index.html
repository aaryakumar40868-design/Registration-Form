<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Form</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .form-wrapper {
      background: linear-gradient(135deg, #1f7fb7 0%, #145c8d 100%);
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(15, 79, 129, 0.2);
      max-width: 440px;
      width: 100%;
      transition: all 0.3s ease;
    }

    .form-card,
    .success-card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
    }

    .form-card h1 {
      margin: 0 0 20px;
      text-align: center;
      font-size: 24px;
      color: #333;
    }

    .success-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 420px;
      text-align: center;
      padding: 40px 30px;
    }

    .success-badge {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #eaf8ee, #ccefd7);
      color: #1f7d4f;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .success-card h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 2.8rem);
      color: #163e59;
    }

    .success-name {
      margin-top: 10px;
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 700;
      color: #0f4f81;
    }

    .success-card p {
      margin: 18px 0 0;
      font-size: 1rem;
      color: #4e5d6a;
      line-height: 1.6;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: #333;
    }

    .input-group {
      margin-bottom: 20px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: #f1f3f5;
      font-size: 15px;
      color: #222;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #4a90e2;
      outline: none;
      background: #fff;
    }

    .error {
      margin-top: 6px;
      color: #d11a2a;
      font-size: 13px;
      line-height: 1.3;
    }

    /* visual states for inputs */
    .input-valid {
      border-color: #2ecc71 !important;
      background: #f7fff7;
      box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.08);
    }

    .input-invalid {
      border-color: #e74c3c !important;
      background: #fff7f7;
      box-shadow: 0 0 0 3px rgba(149, 26, 12, 0.06);
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #14609e;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .submit-btn:hover {
      background: #0f4f81;
    }

    .success-message {
      display: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px;
      }

      .form-wrapper {
        padding: 18px;
      }

      .form-card,
      .success-card {
        padding: 22px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="form-wrapper">
    <div class="form-card" id="registrationCard">
      <h1>Registration Form</h1>
      <form id="registrationForm" novalidate>
        <div class="input-group">
          <label for="name">Name *</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" required />
          <div class="error" id="nameError"></div>
        </div>

        <div class="input-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required />
          <div class="error" id="emailError"></div>
        </div>

        <div class="input-group">
          <label for="phone">Phone *</label>
          <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required />
          <div class="error" id="phoneError"></div>
        </div>

        <div class="input-group">
          <label for="pincode">Pincode *</label>
          <input type="text" id="pincode" name="pincode" placeholder="Enter your pincode" required maxlength="6" />
          <div class="error" id="pincodeError"></div>
        </div>

        <div class="input-group">
          <label for="subject">Subject *</label>
          <select id="subject" name="subject" required>
            <option value="">Select a subject</option>
            <option value="registration">Registration</option>
            <option value="support">Support</option>
            <option value="feedback">Feedback</option>
            <option value="other">Other</option>
          </select>
          <div class="error" id="subjectError"></div>
        </div>

        <div class="input-group">
          <label for="message">Message *</label>
          <textarea id="message" name="message" placeholder="Enter your message" required></textarea>
          <div class="error" id="messageError"></div>
        </div>

        <button type="submit" class="submit-btn">Submit</button>
        <div class="success-message" id="successMessage" aria-live="polite">
          Registration submitted successfully!
        </div>
      </form>
    </div>

    <div class="success-card" id="successScreen" aria-live="polite" style="display: none;">
      <div class="success-badge">✓</div>
      <h1>Welcome</h1>
      <div class="success-name" id="welcomeName">User</div>
      <p>You have successfully registered.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
